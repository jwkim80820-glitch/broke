<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231a2b">
<meta name="description" content="왁뿌볼 부수기, 말랑이 꾹 누르기, 슬라임 늘리기 ASMR 놀이">
<title>왁뿌볼 부수기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f9b9d0'/%3E%3Cpath d='M16 3l-3 9 5 4-4 7 2 6' fill='none' stroke='%239c4468' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #231a2b;
    --bg-glow: #49375a;
    --panel: #30253a;
    --panel-line: #4b3c59;
    --text: #f8eee4;
    --muted: #c4b5c9;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top" "tabs" "stage" "shelf";
    background: radial-gradient(circle at 50% 50%, var(--bg-glow), transparent 68%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* 상단 바 */
  #top {
    grid-area: top;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 10px 16px 6px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .stats { display: flex; align-items: center; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #mute {
    width: 44px;
    justify-content: center;
    padding: 0;
    cursor: pointer;
  }
  #mute svg { width: 20px; height: 20px; }
  #mute[aria-pressed="true"] .waves { display: none; }
  #mute[aria-pressed="false"] .cross { display: none; }

  /* 탭 */
  #tabs {
    grid-area: tabs;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 2px 16px 6px;
  }
  .tab {
    height: 40px;
    border-radius: 20px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #3a2600; }

  /* 게임 영역 */
  #stage {
    grid-area: stage;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  #game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
  }
  #label {
    position: absolute;
    top: 4px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
  }
  #ball-name { font-size: 17px; font-weight: 800; }
  #ball-sound { margin-top: 2px; font-size: 13px; color: var(--muted); }
  #hint { margin-top: 2px; font-size: 13px; color: var(--accent); transition: opacity .2s; }
  #hint.off { opacity: 0; }
  #combo {
    position: absolute;
    top: 76px;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 12px;
    border-radius: 14px;
    background: var(--accent);
    color: #3a2600;
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }
  #combo.on { opacity: 1; }
  #toast {
    position: absolute;
    left: 50%;
    bottom: 76px;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 8px 14px;
    border-radius: 18px;
    background: #fff4e3;
    color: #33243a;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
  }
  #toast.on { opacity: 1; }

  /* 꾹 누르기 버튼 (왁뿌볼 탭에서만) */
  #hold {
    display: none;
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    min-width: 168px;
    height: 50px;
    padding: 0 22px;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 25px;
    background: var(--accent);
    color: #3a2600;
    font-size: 17px;
    font-weight: 800;
    box-shadow: 0 4px 0 #b78a1f, 0 8px 18px rgba(0,0,0,.35);
    cursor: pointer;
    touch-action: none;
  }
  #app[data-tab="wax"] #hold { display: inline-flex; }
  #hold.on {
    transform: translateX(-50%) translateY(3px);
    box-shadow: 0 1px 0 #b78a1f, 0 0 26px rgba(255,209,102,.55);
    background: #ffe29a;
  }

  /* 선택 목록 */
  #shelf {
    grid-area: shelf;
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 8px 16px 12px;
    overflow-x: auto;
    overscroll-behavior: contain;
    touch-action: pan-x;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-line) transparent;
  }
  .card {
    flex: none;
    width: 86px;
    min-height: 92px;
    padding: 8px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border-radius: 14px;
    border: 2px solid var(--panel-line);
    background: var(--panel);
    cursor: pointer;
    transition: transform .1s, border-color .15s;
  }
  .card:active { transform: scale(.96); }
  .card canvas { width: 52px; height: 52px; display: block; }
  .card .name {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    word-break: keep-all;
  }
  .card.selected { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  @media (min-width: 820px) {
    #shelf { justify-content: center; }
    h1 { font-size: 20px; }
  }
  /* 가로로 눕힌 폰: 목록을 오른쪽으로 옮겨 놀이 영역이 쓸 높이를 확보 */
  @media (orientation: landscape) and (max-height: 520px) {
    #app {
      grid-template-columns: minmax(0, 1fr) 208px;
      grid-template-rows: auto auto minmax(0, 1fr);
      grid-template-areas: "top shelf" "tabs shelf" "stage shelf";
    }
    #top { padding: 6px 12px 4px; max-width: none; }
    #tabs { max-width: none; padding: 0 12px 4px; }
    .tab { height: 34px; font-size: 14px; }
    h1 { font-size: 16px; }
    #shelf {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: max-content;
      align-content: start;
      padding: 8px;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y;
      max-width: none;
    }
    .card { width: auto; }
    #label { text-align: left; left: 12px; top: 0; }
    #combo { left: 12px; top: 74px; transform: none; }
    #hold { left: 12px; bottom: 10px; transform: none; min-width: 124px; height: 44px; font-size: 15px; }
    #hold.on { transform: translateY(3px); }
    #toast { bottom: 10px; }
  }
  @media (max-width: 360px) {
    h1 { font-size: 15px; }
    .chip { padding: 0 9px; font-size: 13px; }
    #top { padding: 8px 10px 4px; gap: 6px; }
    #tabs { padding-left: 10px; padding-right: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .tab { transition: none; }
  }
</style>
</head>
<body>
<div id="app" data-tab="wax">
  <header id="top">
    <h1>왁뿌볼 부수기</h1>
    <div class="stats">
      <span class="chip" id="stat" aria-live="off"></span>
      <button class="chip" id="mute" type="button" aria-label="소리 끄기" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path class="waves" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>
          <path class="cross" d="M17 10l4 4M21 10l-4 4"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="tabs" role="tablist" aria-label="놀이 고르기">
    <button class="tab" role="tab" type="button" data-tab="wax">왁뿌볼</button>
    <button class="tab" role="tab" type="button" data-tab="squishy">말랑이</button>
    <button class="tab" role="tab" type="button" data-tab="slime">슬라임</button>
  </div>

  <main id="stage">
    <canvas id="game" aria-label="놀이 화면. 눌러서 즐기세요. 키보드는 스페이스 키."></canvas>
    <div id="label">
      <div id="ball-name"></div>
      <div id="ball-sound"></div>
      <div id="hint"></div>
    </div>
    <div id="combo"></div>
    <div id="toast" role="status"></div>
    <button id="hold" type="button">꾹 누르기</button>
  </main>

  <nav id="shelf" aria-label="종류 선택"></nav>
</div>

<script src="sounds.js"></script>
<script>
'use strict';

/* ---------- 왁뿌볼 정의 ---------- */
const RAINBOW = ['#ff6b6b', '#ff9f43', '#feca57', '#55d98d', '#48c6ef', '#6a89f7', '#c77dff'];
const BALLS = [
  { id: 'basic', name: '기본 왁스볼', sound: '바삭바삭', hits: 3, style: 'crisp',
    c: ['#fff1f6', '#f9b9d0', '#cf6f97'], inner: '#fff6e3', crack: '#8f3c5f',
    shard: ['#f9b9d0', '#ffdbe8', '#fff6e3'], shape: 'flake' },
  { id: 'honey', name: '꿀왁스볼', sound: '끈적하고 묵직하게', hits: 4, style: 'honey',
    c: ['rgba(255,228,140,.95)', 'rgba(244,166,40,.92)', 'rgba(164,88,8,.96)'], inner: '#ffc84a', crack: '#7a4105',
    shard: ['#f4a628', '#ffc84a', '#d98612'], shape: 'drop' },
  { id: 'glass', name: '유리왁스볼', sound: '맑고 쨍하게', hits: 3, style: 'glass',
    c: ['rgba(240,252,255,.62)', 'rgba(150,216,240,.34)', 'rgba(80,160,205,.62)'], inner: 'rgba(25,55,85,.72)', crack: '#f4fdff',
    shard: ['#d6f4ff', '#a4e2f7', '#ffffff'], shape: 'shard' },
  { id: 'choco', name: '초코왁스볼', sound: '낮게 뚝 부러지게', hits: 6, style: 'choco',
    c: ['#c98a5e', '#8c5431', '#4e2b17'], inner: '#f3dcc0', crack: '#2e170b',
    shard: ['#8c5431', '#a96b42', '#f3dcc0'], shape: 'chunk' },
  { id: 'pop', name: '팝핑볼', sound: '톡톡 터지게', hits: 4, style: 'pop',
    c: ['#e7dcff', '#a98df0', '#6346b8'], inner: '#fff0a8', crack: '#3a2382',
    shard: ['#ff7eb6', '#7ee0ff', '#ffe66d', '#9cf08a'], shape: 'bead' },
  { id: 'ice', name: '얼음왁스볼', sound: '차갑고 높게', hits: 5, style: 'ice',
    c: ['#ffffff', '#bfe9fb', '#5aa7d6'], inner: '#eafaff', crack: '#2f7fb4',
    shard: ['#ffffff', '#c9eefc', '#8fd3f3'], shape: 'ice' },
  { id: 'rainbow', name: '무지개볼', sound: '부술수록 음이 올라가게', hits: 7, style: 'rainbow',
    c: ['#ffffff', '#ff9f43', '#c77dff'], inner: '#fff8e8', crack: '#3e2c52',
    shard: RAINBOW, shape: 'flake' },
  { id: 'gold', name: '황금왁스볼', sound: '묵직한 금속음', hits: 10, style: 'gold',
    c: ['#fff6c2', '#f2bd2f', '#996400'], inner: '#fff1ad', crack: '#6c4600',
    shard: ['#ffd84a', '#fff1ad', '#e0a112'], shape: 'flake' }
];

/* ---------- 말랑이 / 슬라임 정의 ----------
   k: 원래 모양으로 돌아오는 힘, damp: 출렁임을 잡는 정도(작을수록 오래 출렁),
   wave: 출렁임이 옆으로 퍼지는 정도, depth: 꾹 눌렀을 때 들어가는 깊이, rate: 소리 음높이 */
const SOFT = {
  squishy: [
    { id: 'mochi', name: '모찌 말랑이', sound: '말랑말랑 꾹', k: 95, damp: 7, wave: 40, depth: 0.5, rate: 1.0,
      col: ['#fffafc', '#ffd6e5', '#ee9fbd'], rim: '#c2688a', kind: 'mochi', face: true,
      shard: ['#ffffff', '#ffd6e5', '#ffb6cf'], shape: 'bead' },
    { id: 'jelly', name: '젤리 말랑이', sound: '탱글탱글 흔들흔들', k: 170, damp: 4.5, wave: 80, depth: 0.45, rate: 1.18,
      col: ['rgba(255,196,210,.96)', 'rgba(255,96,130,.9)', 'rgba(185,28,70,.96)'], rim: '#9b1c43', kind: 'jelly', face: true,
      shard: ['#ff8aa5', '#ffd1dc', '#ffffff'], shape: 'bead' },
    { id: 'marsh', name: '마시멜로 말랑이', sound: '폭신폭신', k: 120, damp: 11, wave: 50, depth: 0.42, rate: 0.86,
      col: ['#ffffff', '#fff0c4', '#efd088'], rim: '#b08a3c', kind: 'marsh', face: true,
      shard: ['#ffffff', '#fff0c4', '#ffe29a'], shape: 'bead' },
    { id: 'pudding', name: '푸딩 말랑이', sound: '말랑 출렁', k: 70, damp: 3.5, wave: 60, depth: 0.5, rate: 0.8,
      col: ['#fff7bd', '#ffd75a', '#e5a52c'], rim: '#a8721a', kind: 'pudding', face: true,
      shard: ['#ffd75a', '#fff7bd', '#8a4a12'], shape: 'bead' }
  ],
  slime: [
    { id: 'green', name: '초록 슬라임', sound: '쭈욱 늘려보세요', k: 45, damp: 14, wave: 30, depth: 0.4, rate: 1.0, pull: true,
      col: ['#eaffc8', '#8ee04c', '#2f9b2d'], rim: '#1f7a22', kind: 'green',
      shard: ['#8ee04c', '#c9f59a', '#3fae33'], shape: 'drop' },
    { id: 'glitter', name: '글리터 슬라임', sound: '반짝반짝 끈적', k: 55, damp: 11, wave: 36, depth: 0.4, rate: 1.1, pull: true,
      col: ['#ffe3f5', '#ff8fd1', '#c13fa5'], rim: '#8c2476', kind: 'glitter',
      shard: ['#ff8fd1', '#ffe3f5', '#fff2a8'], shape: 'drop' },
    { id: 'galaxy', name: '은하 슬라임', sound: '우주처럼 느릿느릿', k: 38, damp: 8, wave: 28, depth: 0.4, rate: 0.85, pull: true,
      col: ['#9a86ff', '#4b30b8', '#160b4d'], rim: '#0d0630', kind: 'galaxy',
      shard: ['#9a86ff', '#ff8fd1', '#8fe3ff'], shape: 'drop' },
    { id: 'clear', name: '투명 슬라임', sound: '뽀글뽀글', k: 60, damp: 16, wave: 34, depth: 0.4, rate: 1.25, pull: true,
      col: ['rgba(240,251,255,.8)', 'rgba(150,216,246,.6)', 'rgba(66,148,205,.75)'], rim: '#3b86b8', kind: 'clear',
      shard: ['#d8f3ff', '#9fdcf6', '#ffffff'], shape: 'drop' }
  ]
};
const TABS = {
  wax: { list: BALLS, hint: '공을 눌러서 부숴보세요', stat: n => `부순 공 ${n.toLocaleString('ko-KR')}` },
  squishy: { list: SOFT.squishy, hint: '꾹 눌러서 말랑말랑 느껴보세요', stat: n => `말랑 ${n.toLocaleString('ko-KR')}` },
  slime: { list: SOFT.slime, hint: '잡아서 쭈욱 늘려보세요', stat: n => `슬라임 ${n.toLocaleString('ko-KR')}` }
};
SOFT.squishy.forEach(d => { d.group = 'squishy'; });
SOFT.slime.forEach(d => { d.group = 'slime'; });

const COMBO_WINDOW = 1.8;
const MAX_PARTICLES = 240;
const TAU = Math.PI * 2;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const compactQuery = matchMedia('(orientation: landscape) and (max-height: 520px)');

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const angDiff = (a, b) => ((a - b + Math.PI * 3) % TAU) - Math.PI;

/* ---------- 저장 ---------- */
const SAVE_KEY = 'wakppu-ball-v2';
function loadSave() {
  const fresh = {
    counts: { wax: 0, squishy: 0, slime: 0 },
    selected: { wax: 'basic', squishy: 'mochi', slime: 'green' },
    tab: 'wax',
    muted: false
  };
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!raw || typeof raw !== 'object') return fresh;
    Object.keys(TABS).forEach(t => {
      const n = raw.counts && raw.counts[t];
      if (Number.isFinite(n) && n > 0) fresh.counts[t] = Math.floor(n);
      const id = raw.selected && raw.selected[t];
      if (TABS[t].list.some(d => d.id === id)) fresh.selected[t] = id;
    });
    if (TABS[raw.tab]) fresh.tab = raw.tab;
    fresh.muted = raw.muted === true;
    return fresh;
  } catch (e) {
    return fresh;
  }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 저장이 막힌 브라우저에서는 이번 판만 유지 */ }
}
const save = loadSave();
const defOf = (tab, id) => TABS[tab].list.find(d => d.id === id);

/* ---------- 소리 ----------
   실제 녹음(CC0) 소리는 sounds.js 에 들어 있고, 못 불러왔을 때를 위해 Web Audio 합성음을 대신 쓴다. */
const audio = { ctx: null, master: null, noise: null, buf: {}, loading: false };

function initAudio() {
  if (!audio.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0.85;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp);
    comp.connect(ctx.destination);
    const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    Object.assign(audio, { ctx, master, noise: buf });
  }
  if (audio.ctx.state === 'suspended') audio.ctx.resume();
  loadSamples();
}

function loadSamples() {
  if (audio.loading || !audio.ctx || !window.SOUND_DATA) return;
  audio.loading = true;
  Object.entries(window.SOUND_DATA).forEach(([key, b64]) => {
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const done = buf => { audio.buf[key] = buf; };
      const p = audio.ctx.decodeAudioData(bytes.buffer, done, () => {});
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* 이 소리만 건너뛴다 */ }
  });
}

function playSample(key, { gain = 1, rate = 1, pan = 0, delay = 0, out = audio.master } = {}) {
  const ctx = audio.ctx;
  const buf = audio.buf[key];
  if (!ctx || !buf) return false;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate;
  const g = ctx.createGain();
  g.gain.value = gain;
  src.connect(g);
  let tail = g;
  if (ctx.createStereoPanner) {
    const p = ctx.createStereoPanner();
    p.pan.value = clamp(pan, -0.7, 0.7);
    g.connect(p);
    tail = p;
  }
  tail.connect(out);
  src.start(ctx.currentTime + delay + 0.001);
  return true;
}

function envelope(ctx, t, attack, dur, gain) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
  return g;
}

function noise(out, t, { type = 'bandpass', f = 2000, to = null, q = 1, dur = 0.03, g = 0.4, a = 0.001 }) {
  const ctx = audio.ctx;
  const src = ctx.createBufferSource();
  src.buffer = audio.noise;
  const filter = ctx.createBiquadFilter();
  filter.type = type;
  filter.Q.value = q;
  filter.frequency.setValueAtTime(f, t);
  if (to) filter.frequency.exponentialRampToValueAtTime(to, t + a + dur);
  const env = envelope(ctx, t, a, dur, g);
  src.connect(filter);
  filter.connect(env);
  env.connect(out);
  src.start(t, Math.random() * 0.8, a + dur + 0.02);
}

function tone(out, t, { type = 'sine', f = 440, to = null, dur = 0.1, g = 0.3, a = 0.002 }) {
  const ctx = audio.ctx;
  const osc = ctx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(f, t);
  if (to) osc.frequency.exponentialRampToValueAtTime(to, t + a + dur);
  const env = envelope(ctx, t, a, dur, g);
  osc.connect(env);
  env.connect(out);
  osc.start(t);
  osc.stop(t + a + dur + 0.02);
}

/* 짧은 노이즈 알갱이를 흩뿌려 바스러지는 질감을 만든다 */
function crackle(out, t, count, spread, { f, q = [1.5, 4], dur = [0.01, 0.035], g = [0.2, 0.45], type = 'bandpass' }) {
  for (let i = 0; i < count; i++) {
    noise(out, t + Math.pow(Math.random(), 1.5) * spread, {
      type, f: rand(f[0], f[1]), q: rand(q[0], q[1]), dur: rand(dur[0], dur[1]), g: rand(g[0], g[1])
    });
  }
}

const PENTATONIC = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];

/* 왁뿌볼 종류별 녹음 소리. 칠 때마다 음높이를 조금씩 바꿔 반복감을 줄인다.

function playSpec(spec, pan, n, out) {
  const keys = spec.keys.filter(k => audio.buf[k]);
  if (!keys.length) return false;
  const count = spec.multi ? randInt(spec.multi[0], spec.multi[1]) : 1;
  for (let i = 0; i < count; i++) {
    const rate = spec.rate === 'note' ? PENTATONIC[n % PENTATONIC.length] / PENTATONIC[0] : rand(spec.rate[0], spec.rate[1]);
    playSample(pick(keys), { gain: spec.gain * rand(0.9, 1), rate, pan, delay: i * rand(0.03, 0.07), out });
  }
  return true;
}

/* 왼쪽을 치면 왼쪽에서 들리도록 타격 위치를 소리 좌우에 반영 */
function playSound(style, kind, pan, n) {
  if (save.muted || !audio.ctx) return;
  const ctx = audio.ctx;
  const map = SAMPLE_MAP[style];
  const used = playSpec(map[kind], pan, n, audio.master);
  if (used && !map.layer) return;
  const bus = ctx.createGain();
  bus.gain.value = used ? map.layer : 1;
  let out = bus;
  if (ctx.createStereoPanner) {
    const p = ctx.createStereoPanner();
    p.pan.value = clamp(pan, -0.7, 0.7);
    bus.connect(p);
    out = p;
  }
  out.connect(audio.master);
  SOUNDS[style][kind](bus, ctx.currentTime + 0.001, n);
}

/* 말랑이/슬라임 소리: press 누를 때, hold 꾹 누르는 동안, move 슬라임을 끌 때, release 놓을 때, snap 늘린 걸 놓을 때 */
const SOFT_SND = {
  squishy: {
    press: ['squish_01', 'squish_02', 'squish_03', 'squish_04', 'squish_05', 'squish_06'],
    hold: ['squish_02', 'squish_04', 'squish_05'],
    release: ['squish_pop', 'squish_splat', 'squish_pop']
  },
  slime: {
    press: ['slime_01', 'slime_02', 'slime_03', 'slime_04', 'mud_05'],
    hold: ['bubble_01', 'bubble_02', 'bubble_03'],
    move: ['slime_05', 'slime_06', 'slime_07', 'slime_08', 'slime_09', 'slime_10', 'slime_11', 'slime_13', 'slime_14', 'slime_15', 'slime_16', 'mud_09'],
    release: ['bubble_01', 'bubble_02', 'bubble_03', 'slime_03'],
    snap: ['squish_splat', 'mud_17', 'mud_19']
  }
};

function playSoft(kind, def, power, pan) {
  if (save.muted || !audio.ctx) return;
  const group = SOFT_SND[def.group];
  const keys = (group[kind] || group.press).filter(k => audio.buf[k]);
  const gain = { press: 0.65 + 0.4 * power, hold: 0.3 + 0.2 * power, move: 0.3 + 0.4 * power, release: 0.55 + 0.4 * power, snap: 0.9 + 0.2 * power }[kind] || 0.7;
  if (keys.length) {
    playSample(pick(keys), { gain, rate: def.rate * rand(0.93, 1.07) * (kind === 'hold' ? 0.9 : 1), pan });
    return;
  }
  // 녹음 소리가 없을 때의 합성음
  const t = audio.ctx.currentTime + 0.001;
  noise(audio.master, t, { f: 300 * def.rate, to: 1100 * def.rate, q: 4, dur: 0.16, g: 0.4 * gain, a: 0.01 });
  tone(audio.master, t, { f: 170 * def.rate, to: 80 * def.rate, dur: 0.12, g: 0.3 * gain });
}

function playPick() {
  if (save.muted || !audio.ctx) return;
  const t = audio.ctx.currentTime + 0.001;
  tone(audio.master, t, { type: 'triangle', f: 880, dur: 0.06, g: 0.12 });
  tone(audio.master, t + 0.05, { type: 'triangle', f: 1318.5, dur: 0.1, g: 0.12 });
}

function buzz(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/* ---------- 공 그리기 ---------- */
function makeDeco(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let x = Math.imul(s ^ (s >>> 15), 1 | s);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
  const pts = [];
  for (let i = 0; i < 70; i++) {
    const ang = rng() * TAU;
    const rad = Math.sqrt(rng()) * 0.97;
    pts.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, s: rng(), a: rng() * TAU, k: rng() });
  }
  return pts;
}

function star(c, x, y, size) {
  c.beginPath();
  c.moveTo(x, y - size);
  c.quadraticCurveTo(x, y, x + size, y);
  c.quadraticCurveTo(x, y, x, y + size);
  c.quadraticCurveTo(x, y, x - size, y);
  c.quadraticCurveTo(x, y, x, y - size);
  c.fill();
}

const SPRINKLES = ['#ffffff', '#ffe08a', '#a8e6cf', '#9fd3ff', '#ff8fb3'];
const POP_BEADS = ['#ff7eb6', '#7ee0ff', '#ffe66d', '#9cf08a', '#ffffff'];

const DECO = {
  crisp(c, r, pts) {
    c.lineCap = 'round';
    c.lineWidth = r * 0.035;
    pts.slice(0, 24).forEach((p, i) => {
      c.strokeStyle = SPRINKLES[i % SPRINKLES.length];
      const dx = Math.cos(p.a) * r * 0.04, dy = Math.sin(p.a) * r * 0.04;
      c.beginPath();
      c.moveTo(p.x * r - dx, p.y * r - dy);
      c.lineTo(p.x * r + dx, p.y * r + dy);
      c.stroke();
    });
  },
  honey(c, r, pts) {
    pts.slice(0, 16).forEach(p => {
      const size = r * (0.025 + p.s * 0.06);
      c.fillStyle = 'rgba(255,240,180,.26)';
      c.strokeStyle = 'rgba(255,248,214,.55)';
      c.lineWidth = Math.max(0.6, r * 0.008);
      c.beginPath();
      c.arc(p.x * r, p.y * r, size, 0, TAU);
      c.fill();
      c.stroke();
    });
  },
  glass(c, r, pts) {
    c.strokeStyle = 'rgba(255,255,255,.5)';
    c.lineWidth = r * 0.03;
    c.beginPath();
    c.arc(0, 0, r * 0.78, 0.25, 1.35);
    c.stroke();
    c.fillStyle = 'rgba(255,255,255,.85)';
    pts.slice(0, 7).forEach(p => star(c, p.x * r * 0.8, p.y * r * 0.8, r * (0.018 + p.s * 0.035)));
  },
  choco(c, r, pts) {
    c.lineCap = 'round';
    pts.slice(0, 7).forEach((p, i) => {
      c.strokeStyle = i % 2 ? 'rgba(240,195,150,.32)' : 'rgba(40,18,6,.38)';
      c.lineWidth = r * (0.03 + p.s * 0.03);
      c.beginPath();
      c.arc(p.x * r * 0.5, p.y * r * 0.5, r * (0.25 + p.k * 0.55), p.a, p.a + 1.1 + p.s);
      c.stroke();
    });
  },
  pop(c, r, pts) {
    pts.forEach((p, i) => {
      const size = r * (0.028 + p.s * 0.035);
      c.fillStyle = POP_BEADS[i % POP_BEADS.length];
      c.beginPath();
      c.arc(p.x * r, p.y * r, size, 0, TAU);
      c.fill();
    });
  },
  ice(c, r, pts) {
    c.strokeStyle = 'rgba(255,255,255,.75)';
    c.lineCap = 'round';
    c.lineWidth = Math.max(0.7, r * 0.012);
    pts.slice(0, 11).forEach(p => {
      const x = p.x * r, y = p.y * r, len = r * (0.06 + p.s * 0.1);
      for (let i = 0; i < 6; i++) {
        const a = p.a + i * Math.PI / 3;
        c.beginPath();
        c.moveTo(x, y);
        c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
        c.stroke();
      }
    });
  },
  rainbow(c, r, pts, taken) {
    const h = (r * 2) / RAINBOW.length;
    RAINBOW.forEach((col, i) => {
      c.fillStyle = RAINBOW[(i + taken) % RAINBOW.length];
      c.fillRect(-r, -r + i * h, r * 2, h + 1);
    });
  },
  gold(c, r, pts, taken, now) {
    const band = c.createLinearGradient(-r, -r, r, r);
    band.addColorStop(0.28, 'rgba(255,255,255,0)');
    band.addColorStop(0.42, 'rgba(255,255,255,.6)');
    band.addColorStop(0.56, 'rgba(255,255,255,0)');
    c.fillStyle = band;
    c.fillRect(-r, -r, r * 2, r * 2);
    c.fillStyle = '#fffbe0';
    pts.slice(0, 9).forEach(p => {
      const twinkle = 0.45 + 0.55 * Math.sin(now * 3 + p.a * 5);
      star(c, p.x * r, p.y * r, r * (0.02 + p.s * 0.05) * Math.max(0.15, twinkle));
    });
  }
};

function drawBall(c, def, r, deco, state, now) {
  const taken = state ? state.taken : 0;
  c.save();
  c.beginPath();
  c.arc(0, 0, r, 0, TAU);
  c.clip();

  const base = c.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.08, 0, 0, r * 1.05);
  base.addColorStop(0, def.c[0]);
  base.addColorStop(0.55, def.c[1]);
  base.addColorStop(1, def.c[2]);
  c.fillStyle = base;
  c.fillRect(-r, -r, r * 2, r * 2);
  DECO[def.style](c, r, deco, taken, now);

  // 입체감: 가장자리 그늘
  const rim = c.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.5, 0, 0, r);
  rim.addColorStop(0, 'rgba(20,5,30,0)');
  rim.addColorStop(1, 'rgba(20,5,30,.42)');
  c.fillStyle = rim;
  c.fillRect(-r, -r, r * 2, r * 2);

  if (state) {
    state.chips.forEach(chip => {
      c.fillStyle = def.inner;
      c.strokeStyle = def.crack;
      c.lineWidth = Math.max(1, r * 0.012);
      c.beginPath();
      chip.forEach((p, i) => i ? c.lineTo(p[0] * r, p[1] * r) : c.moveTo(p[0] * r, p[1] * r));
      c.closePath();
      c.fill();
      c.stroke();
    });
    c.lineJoin = 'round';
    c.lineCap = 'round';
    c.strokeStyle = def.crack;
    state.cracks.forEach(line => {
      c.lineWidth = Math.max(1, r * line.w);
      c.beginPath();
      line.pts.forEach((p, i) => i ? c.lineTo(p[0] * r, p[1] * r) : c.moveTo(p[0] * r, p[1] * r));
      c.stroke();
    });
  }

  // 위쪽 광택
  c.fillStyle = 'rgba(255,255,255,.34)';
  c.beginPath();
  c.ellipse(-r * 0.32, -r * 0.48, r * 0.3, r * 0.17, -0.55, 0, TAU);
  c.fill();
  c.restore();
}

/* 타격 지점에서 뻗어 나가는 금과 떨어져 나간 조각. 공 크기가 바뀌어도 맞도록 반지름 기준 좌표로 저장 */
function addDamage(state, hx, hy) {
  const damage = state.taken / state.def.hits;
  const branches = randInt(3, 5);
  const start = rand(0, TAU);
  for (let i = 0; i < branches; i++) {
    let a = start + i * (TAU / branches) + rand(-0.4, 0.4);
    let x = hx, y = hy;
    const pts = [[x, y]];
    const steps = randInt(3, 6);
    const step = rand(0.08, 0.14) + damage * 0.08;
    for (let j = 0; j < steps; j++) {
      a += rand(-0.55, 0.55);
      x += Math.cos(a) * step;
      y += Math.sin(a) * step;
      pts.push([x, y]);
      if (j > 0 && Math.random() < 0.3) {
        const ba = a + (Math.random() < 0.5 ? -1 : 1) * rand(0.5, 1.1);
        const bl = rand(0.08, 0.2);
        state.cracks.push({ w: 0.012, pts: [[x, y], [x + Math.cos(ba) * bl, y + Math.sin(ba) * bl]] });
      }
    }
    state.cracks.push({ w: 0.02, pts });
  }
  const size = rand(0.09, 0.14) + damage * 0.12;
  const corners = randInt(6, 9);
  const chip = [];
  for (let i = 0; i < corners; i++) {
    const a = (i / corners) * TAU;
    const d = size * rand(0.6, 1.25);
    chip.push([hx + Math.cos(a) * d, hy + Math.sin(a) * d]);
  }
  state.chips.push(chip);
}

/* ---------- 말랑이 / 슬라임 몸체 ----------
   몸 둘레를 NP개 점으로 나누고, 각 점이 기준 반지름에서 얼마나 벗어났는지(d)를 스프링으로 움직인다.
   누르면 그 방향이 들어가고(몸 전체 부피는 거의 일정), 놓으면 출렁이며 돌아온다. */
const NP = 64;
const ZERO_D = new Float32Array(NP);

function makeBlob(def) {
  return {
    def,
    d: new Float32Array(NP), v: new Float32Array(NP), tgt: new Float32Array(NP), w: new Float32Array(NP),
    ox: 0, oy: 0, ovx: 0, ovy: 0, sq: 0, sqv: 0,
    grow: 0, phase: rand(0, TAU), deco: makeDeco(Math.floor(Math.random() * 1e9)),
    pressing: false, releaseReq: false, holdT: 0, px: 0, py: 0, depth: 0, stretch: 0,
    creak: 0, travel: 0, lastMove: 0
  };
}

function tracePath(c, pts) {
  const n = pts.length;
  c.beginPath();
  c.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  c.closePath();
}

const SOFT_DECO = {
  mochi(c, R) {
    const g = c.createRadialGradient(R * 0.1, R * 0.5, R * 0.1, 0, 0, R * 1.1);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(255,255,255,.3)');
    c.fillStyle = g;
    c.fillRect(-R * 1.5, -R * 1.5, R * 3, R * 3);
  },
  jelly(c, R) {
    const g = c.createRadialGradient(0, 0, R * 0.1, 0, 0, R);
    g.addColorStop(0, 'rgba(255,255,255,.32)');
    g.addColorStop(0.7, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.fillRect(-R * 1.5, -R * 1.5, R * 3, R * 3);
    c.strokeStyle = 'rgba(255,255,255,.4)';
    c.lineWidth = R * 0.035;
    c.beginPath();
    c.arc(0, 0, R * 0.82, 0.5, 1.9);
    c.stroke();
  },
  marsh(c, R) {
    c.fillStyle = 'rgba(205,170,100,.2)';
    for (let i = 0; i < 5; i++) {
      c.beginPath();
      c.arc(R * (-0.55 + i * 0.28), R * (0.55 + 0.08 * (i % 2)), R * 0.04, 0, TAU);
      c.fill();
    }
  },
  pudding(c, R) {
    const g = c.createLinearGradient(0, -R, 0, -R * 0.25);
    g.addColorStop(0, '#b8651c');
    g.addColorStop(1, '#7a3d0c');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-R * 1.5, -R * 1.5);
    c.lineTo(R * 1.5, -R * 1.5);
    c.lineTo(R * 1.5, -R * 0.42);
    for (let i = 0; i <= 12; i++) {
      const x = R * (1.5 - i * 0.25);
      c.lineTo(x, -R * (0.42 + 0.08 * Math.sin(i * 1.7) + (i % 3 === 0 ? 0.1 : 0)));
    }
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(255,225,170,.4)';
    c.beginPath();
    c.ellipse(-R * 0.35, -R * 0.74, R * 0.22, R * 0.06, -0.2, 0, TAU);
    c.fill();
  },
  green(c, R, d) {
    c.fillStyle = 'rgba(30,110,30,.2)';
    d.slice(0, 6).forEach(p => {
      c.beginPath();
      c.ellipse(p.x * R * 0.7, p.y * R * 0.7, R * (0.14 + p.s * 0.2), R * (0.08 + p.k * 0.12), p.a, 0, TAU);
      c.fill();
    });
    c.fillStyle = 'rgba(255,255,255,.35)';
    d.slice(6, 12).forEach(p => {
      c.beginPath();
      c.arc(p.x * R * 0.8, p.y * R * 0.8, R * (0.02 + p.s * 0.03), 0, TAU);
      c.fill();
    });
  },
  glitter(c, R, d, now) {
    const cols = ['#ffffff', '#fff2a8', '#aef0ff', '#ffd1ee'];
    d.slice(0, 40).forEach((p, i) => {
      const tw = 0.35 + 0.65 * Math.max(0, Math.sin(now * 2.6 + p.a * 4));
      c.fillStyle = cols[i % cols.length];
      star(c, p.x * R, p.y * R, R * (0.03 + p.s * 0.05) * tw);
    });
  },
  galaxy(c, R, d, now) {
    [[0.35, 0.2, 'rgba(255,100,200,.4)'], [-0.4, 0.35, 'rgba(70,200,255,.32)'], [0.05, -0.4, 'rgba(160,120,255,.35)']].forEach(([x, y, col]) => {
      const g = c.createRadialGradient(x * R, y * R, 0, x * R, y * R, R * 0.7);
      g.addColorStop(0, col);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.fillRect(-R * 1.5, -R * 1.5, R * 3, R * 3);
    });
    d.slice(0, 36).forEach(p => {
      const tw = 0.4 + 0.6 * Math.max(0, Math.sin(now * 2 + p.a * 5));
      c.fillStyle = `rgba(255,255,255,${0.35 + 0.65 * tw})`;
      c.beginPath();
      c.arc(p.x * R, p.y * R, R * (0.008 + p.s * 0.016), 0, TAU);
      c.fill();
    });
  },
  clear(c, R, d, now) {
    d.slice(0, 14).forEach(p => {
      const yy = 1.15 - ((p.s * 2.3 + now * (0.03 + 0.05 * p.k)) % 2.3);
      const xx = p.x * 0.75 + Math.sin(now * 0.9 + p.a) * 0.04;
      const r = R * (0.05 + 0.09 * p.k);
      c.strokeStyle = 'rgba(255,255,255,.65)';
      c.fillStyle = 'rgba(255,255,255,.14)';
      c.lineWidth = Math.max(0.7, R * 0.012);
      c.beginPath();
      c.arc(xx * R, yy * R, r, 0, TAU);
      c.fill();
      c.stroke();
      c.fillStyle = 'rgba(255,255,255,.8)';
      c.beginPath();
      c.arc(xx * R - r * 0.35, yy * R - r * 0.35, r * 0.22, 0, TAU);
      c.fill();
    });
  }
};

function drawFace(c, R, squeeze) {
  c.strokeStyle = '#3b2431';
  c.fillStyle = '#3b2431';
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.lineWidth = R * 0.04;
  if (squeeze > 0.55) {
    [-1, 1].forEach(s => {
      c.beginPath();
      c.moveTo(s * R * 0.4, -R * 0.09);
      c.lineTo(s * R * 0.24, -R * 0.02);
      c.lineTo(s * R * 0.4, R * 0.05);
      c.stroke();
    });
    c.beginPath();
    c.ellipse(0, R * 0.17, R * 0.06, R * 0.045, 0, 0, TAU);
    c.fill();
  } else {
    [-1, 1].forEach(s => {
      c.beginPath();
      c.arc(s * R * 0.3, -R * 0.02, R * 0.06, 0, TAU);
      c.fill();
      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(s * R * 0.3 - R * 0.018, -R * 0.04, R * 0.02, 0, TAU);
      c.fill();
      c.fillStyle = '#3b2431';
    });
    c.beginPath();
    c.arc(-R * 0.04, R * 0.11, R * 0.04, 0.1, Math.PI - 0.1);
    c.arc(R * 0.04, R * 0.11, R * 0.04, 0.1, Math.PI - 0.1);
    c.stroke();
  }
  c.fillStyle = 'rgba(255,110,150,.4)';
  [-1, 1].forEach(s => {
    c.beginPath();
    c.ellipse(s * R * 0.5, R * 0.1, R * 0.1, R * 0.06, 0, 0, TAU);
    c.fill();
  });
}

function drawSoft(c, def, b, cx, cy, R, now, floorY) {
  const d = b ? b.d : ZERO_D;
  const sq = b ? b.sq : 0;
  const sx = 1 + 0.55 * sq, sy = 1 - sq;
  const ccx = cx, ccy = cy + R * sq; // 눌릴 때 바닥에 붙어 있는 느낌
  const breath = b ? 0.012 * Math.sin(now * 2.2 + b.phase) : 0;
  const pts = [];
  let maxD = 0;
  for (let i = 0; i < NP; i++) {
    const a = (i * TAU) / NP;
    const r = R * (1 + d[i] + breath * Math.cos(a * 2));
    pts.push([ccx + Math.cos(a) * r * sx, ccy + Math.sin(a) * r * sy]);
    if (d[i] > maxD) maxD = d[i];
  }
  // 길게 늘어나면 색과 그늘 그라데이션도 같이 늘려서 끝부분이 납작해지지 않게 한다
  const ext = 1 + maxD * 0.9;

  c.fillStyle = 'rgba(0,0,0,.28)';
  c.beginPath();
  c.ellipse(cx - (b ? b.ox * R : 0), floorY, R * 0.68 * (1 + 0.45 * sq), R * 0.09, 0, 0, TAU);
  c.fill();

  c.save();
  tracePath(c, pts);
  c.clip();
  const base = c.createRadialGradient(ccx - R * 0.3, ccy - R * 0.4, R * 0.08, ccx, ccy, R * 1.1 * ext);
  base.addColorStop(0, def.col[0]);
  base.addColorStop(0.55, def.col[1]);
  base.addColorStop(1, def.col[2]);
  c.fillStyle = base;
  c.fillRect(ccx - R * 4, ccy - R * 4, R * 8, R * 8);

  c.save();
  c.translate(ccx, ccy);
  c.scale(sx, sy);
  SOFT_DECO[def.kind](c, R, b ? b.deco : makeDeco(7), now);
  const rim = c.createRadialGradient(-R * 0.2, -R * 0.25, R * 0.5, 0, 0, R * 1.05 * ext);
  rim.addColorStop(0, 'rgba(20,5,30,0)');
  rim.addColorStop(1, 'rgba(20,5,30,.36)');
  c.fillStyle = rim;
  c.fillRect(-R * 6, -R * 6, R * 12, R * 12);
  if (def.face) drawFace(c, R, b && b.pressing ? b.depth / def.depth : 0);
  const clearish = def.kind === 'jelly' || def.kind === 'clear';
  c.fillStyle = `rgba(255,255,255,${clearish ? 0.5 : 0.36})`;
  c.beginPath();
  c.ellipse(-R * 0.34, -R * 0.5, R * 0.28, R * 0.15, -0.55, 0, TAU);
  c.fill();
  c.beginPath();
  c.arc(-R * 0.62, -R * 0.22, R * 0.04, 0, TAU);
  c.fill();
  c.restore();
  c.restore();

  tracePath(c, pts);
  c.strokeStyle = def.rim;
  c.globalAlpha = 0.35;
  c.lineWidth = Math.max(1, R * 0.02);
  c.stroke();
  c.globalAlpha = 1;
}

/* ---------- 게임 상태 ---------- */
const app = document.getElementById('app');
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, cx: 0, cy: 0, r: 100, dpr: 1 };

let ball = null;     // 왁뿌볼 탭의 공
let blob = null;     // 말랑이/슬라임 탭의 몸체
let respawn = 0;
let particles = [];
let rings = [];
let shake = 0;
let combo = 0;
let comboTimer = 0;
let clock = 0;
const hold = { on: false, t: 0, acc: 0, src: '' };

function resize() {
  const rect = stage.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  view.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  view.w = rect.width;
  view.h = rect.height;
  canvas.width = Math.round(rect.width * view.dpr);
  canvas.height = Math.round(rect.height * view.dpr);
  view.cx = rect.width / 2;
  // 위쪽 이름표, 아래쪽 꾹 누르기 버튼과 겹치지 않도록 짧은 변 기준으로 계산
  const compact = compactQuery.matches;
  const top = compact ? 10 : 80;
  const bottom = compact ? 10 : (save.tab === 'wax' ? 70 : 20);
  const avail = rect.height - top - bottom;
  view.r = Math.max(46, Math.min(rect.width * 0.38, avail * 0.46, 250));
  view.cy = top + avail / 2;
}

const blobR = () => view.r * (blob && blob.def.pull ? 0.8 : 0.95);

function spawnBall(def) {
  ball = {
    def, hp: def.hits, taken: 0, cracks: [], chips: [],
    deco: makeDeco(Math.floor(Math.random() * 1e9)),
    grow: 0, sq: 0, sqV: 0, nx: 0, ny: 0
  };
  blob = null;
  respawn = 0;
  setLabel(def);
}

function spawnBlob(def) {
  blob = makeBlob(def);
  ball = null;
  respawn = 0;
  softPtr = null;
  setLabel(def);
}

function setLabel(def) {
  document.getElementById('ball-name').textContent = def.name;
  document.getElementById('ball-sound').textContent = def.sound;
}

function spawnCurrent() {
  const def = defOf(save.tab, save.selected[save.tab]);
  if (save.tab === 'wax') spawnBall(def); else spawnBlob(def);
}

function shapePoints(shape) {
  const count = { flake: randInt(3, 5), shard: 3, chunk: randInt(4, 6), ice: 4 }[shape];
  if (!count) return null;
  const pts = [];
  for (let i = 0; i < count; i++) {
    const a = (i / count) * TAU + rand(-0.3, 0.3);
    const d = shape === 'ice' ? (i % 2 ? 0.45 : 1) : rand(0.6, 1.1);
    pts.push([Math.cos(a) * d, Math.sin(a) * d]);
  }
  return pts;
}

function addParticle(p) {
  if (particles.length >= MAX_PARTICLES) particles.shift();
  particles.push(p);
}

function burst(x, y, def, count, speed, spreadFromCenter) {
  const scale = view.r / 150;
  for (let i = 0; i < count; i++) {
    let px = x, py = y, a;
    if (spreadFromCenter) {
      const ang = rand(0, TAU), rad = Math.sqrt(Math.random()) * view.r;
      px = x + Math.cos(ang) * rad;
      py = y + Math.sin(ang) * rad;
      a = ang + rand(-0.4, 0.4);
    } else {
      a = Math.atan2(y - view.cy, x - view.cx) + rand(-1.2, 1.2);
    }
    const v = rand(speed * 0.35, speed) * scale;
    const life = rand(0.55, 1.15);
    addParticle({
      x: px, y: py,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - rand(40, 180) * scale,
      rot: rand(0, 6.28), vr: rand(-9, 9),
      size: rand(3.5, 10) * scale,
      life, max: life,
      color: pick(def.shard),
      shape: def.shape,
      pts: shapePoints(def.shape)
    });
  }
}

/* ---------- 왁뿌볼 부수기 ---------- */
function hitBall(x, y) {
  if (!ball || respawn > 0 || ball.grow < 0.45) return;
  hideHint();
  const def = ball.def;
  const dx = x - view.cx, dy = y - view.cy;
  const dist = Math.hypot(dx, dy) || 1;
  const pan = dx / view.r;

  comboTimer = COMBO_WINDOW;
  ball.hp -= 1;
  const hitIndex = ball.taken;
  ball.taken += 1;

  if (ball.hp <= 0) {
    smash(def, pan);
    return;
  }

  // 공 안쪽으로 살짝 들여서 금이 가장자리에 몰리지 않게
  const limit = Math.min(dist, view.r * 0.86);
  addDamage(ball, (dx / dist) * limit / view.r, (dy / dist) * limit / view.r);
  ball.sqV += 1.6;
  ball.nx += (dx / dist) * -view.r * 0.05;
  ball.ny += (dy / dist) * -view.r * 0.05;
  burst(view.cx + (dx / dist) * limit, view.cy + (dy / dist) * limit, def, randInt(8, 13), 420, false);
  shake = Math.max(shake, 2);
  playSound(def.style, 'hit', pan, hitIndex);
  buzz(10);
}

function smash(def, pan) {
  burst(view.cx, view.cy, def, randInt(65, 90), 760, true);
  rings.push({ x: view.cx, y: view.cy, r: view.r * 0.7, t: 0 });
  shake = Math.max(shake, 9);

  combo += 1;
  save.counts.wax += 1;
  writeSave();
  updateStat();
  updateCombo();

  playSound(def.style, 'smash', pan);
  buzz(35);
  ball = null;
  respawn = 0.38;
}

function updateCombo() {
  const el = document.getElementById('combo');
  if (combo >= 2 && save.tab === 'wax') {
    el.textContent = `콤보 ${combo}`;
    el.classList.add('on');
  } else {
    el.classList.remove('on');
  }
}

function hitRandom() {
  const a = rand(0, TAU), d = Math.sqrt(Math.random()) * view.r * 0.8;
  hitBall(view.cx + Math.cos(a) * d, view.cy + Math.sin(a) * d);
}

/* 꾹 누르는 동안 자동으로 계속 친다. 오래 누를수록 조금씩 빨라진다 */
function holdStart(src) {
  if (save.tab !== 'wax' || hold.on) return;
  initAudio();
  hold.on = true;
  hold.t = 0;
  hold.acc = 999;
  hold.src = src;
  document.getElementById('hold').classList.add('on');
}

function holdStop(src) {
  if (!hold.on || (src && hold.src !== src)) return;
  hold.on = false;
  document.getElementById('hold').classList.remove('on');
}

/* ---------- 말랑이 / 슬라임 만지기 ---------- */
let softPtr = null;

function blobCenter() {
  const R = blobR();
  return { x: view.cx + blob.ox * R, y: view.cy + blob.oy * R, R };
}

function pressStart(px, py, x) {
  const b = blob;
  b.pressing = true;
  b.releaseReq = false;
  b.holdT = 0;
  b.px = px;
  b.py = py;
  b.stretch = 0;
  b.travel = 0;
  b.creak = rand(0.4, 0.6);
  save.counts[save.tab] += 1;
  writeSave();
  updateStat();
  hideHint();
  playSoft('press', b.def, 0.7, x);
  buzz(8);
}

function pressRelease() {
  const b = blob;
  if (!b || !b.pressing) return;
  b.releaseReq = true;
}

function onRelease(b) {
  const def = b.def;
  const power = def.pull ? clamp(b.stretch, 0, 1.5) / 1.5 : b.depth / def.depth;
  const pan = clamp(b.px, -1, 1);
  if (def.pull && b.stretch > 0.45) {
    playSoft('snap', def, power, pan);
    const c = blobCenter();
    burst(c.x + b.px * c.R, c.y + b.py * c.R, def, randInt(6, 10), 380, false);
    buzz(20);
  } else if (b.holdT > 0.15 || power > 0.7) {
    playSoft('release', def, power, pan);
    if (!def.pull && power > 0.8) burst(blobCenter().x, blobCenter().y, def, 6, 300, true);
  }
  b.stretch = 0;
}

/* ---------- 매 프레임 ---------- */
function updateBlob(b, dt) {
  const def = b.def;
  b.grow = Math.min(1, b.grow + dt / 0.3);

  if (b.pressing) {
    b.holdT += dt;
    if (b.releaseReq && b.holdT >= 0.1) {
      b.pressing = false;
      b.releaseReq = false;
      onRelease(b);
    }
  }

  const dist = Math.hypot(b.px, b.py);
  const phi = Math.atan2(b.py, b.px);
  let sqTarget = 0, txc = 0, tyc = 0;
  b.tgt.fill(0);
  b.w.fill(0);

  if (b.pressing) {
    b.depth = def.depth * (0.55 + 0.45 * (1 - Math.exp(-b.holdT * 2)));
    const edge = Math.min(1, dist / 0.55);          // 가운데를 누르면 0, 가장자리를 누르면 1
    const fade = clamp((1.5 - dist) / 0.45, 0, 1);  // 손가락이 몸 밖으로 멀어지면 힘이 빠진다
    const pulling = def.pull && dist > 1.02;
    if (pulling) {
      const ext = Math.min(dist - 1, 1.8);
      b.stretch = Math.max(b.stretch * 0.98, ext);
      const sigma = Math.max(0.3, 0.65 / (1 + 0.9 * ext));
      for (let i = 0; i < NP; i++) {
        const g = Math.exp(-Math.pow(angDiff((i * TAU) / NP, phi) / sigma, 2));
        b.tgt[i] = ext * g;
        b.w[i] = g;
      }
      txc = Math.cos(phi) * Math.min(dist, 2.2) * 0.28;
      tyc = Math.sin(phi) * Math.min(dist, 2.2) * 0.28;
    } else {
      const s = b.depth * (dist < 1 ? 1 : fade);
      for (let i = 0; i < NP; i++) {
        const g = Math.exp(-Math.pow(angDiff((i * TAU) / NP, phi) / 0.75, 2));
        b.tgt[i] = -s * g * edge;
        b.w[i] = g * edge * (dist < 1 ? 1 : fade);
      }
      sqTarget = s * (1 - edge);
      txc = -Math.cos(phi) * s * 0.14 * edge;
      tyc = -Math.sin(phi) * s * 0.14 * edge;
    }
    // 오래 누르고 있으면 계속 뽀드득 소리
    b.creak -= dt;
    if (b.creak <= 0 && b.holdT > 0.35) {
      b.creak = rand(0.28, 0.5);
      if (!def.pull || b.stretch < 0.2) playSoft('hold', def, 0.5, clamp(b.px, -1, 1));
    }
  }

  const held = b.pressing;
  const kHold = 260, cHold = 34;
  const sub = 4, h = dt / sub;
  for (let s = 0; s < sub; s++) {
    let sum = 0;
    for (let i = 0; i < NP; i++) {
      const w = b.w[i];
      const kk = def.k + (kHold - def.k) * w;
      const cc = def.damp + (cHold - def.damp) * w;
      const lap = b.d[(i + NP - 1) % NP] + b.d[(i + 1) % NP] - 2 * b.d[i];
      b.v[i] += (kk * (b.tgt[i] - b.d[i]) - cc * b.v[i] + def.wave * lap) * h;
    }
    for (let i = 0; i < NP; i++) {
      b.d[i] = clamp(b.d[i] + b.v[i] * h, -0.85, 2.8);
      sum += b.d[i];
    }
    const mean = sum / NP;
    for (let i = 0; i < NP; i++) b.d[i] -= mean * 0.8; // 부피 보존: 한쪽이 들어가면 다른 쪽이 부푼다

    const ks = held ? 220 : def.k * 1.1, cs = held ? 28 : def.damp;
    b.sqv += (ks * (sqTarget - b.sq) - cs * b.sqv) * h;
    b.sq = clamp(b.sq + b.sqv * h, -0.2, 0.45);
    const kc = held ? 120 : def.k * 0.9, cc2 = held ? 18 : def.damp * 0.9;
    b.ovx += (kc * (txc - b.ox) - cc2 * b.ovx) * h;
    b.ovy += (kc * (tyc - b.oy) - cc2 * b.ovy) * h;
    b.ox += b.ovx * h;
    b.oy += b.ovy * h;
  }
}

function update(dt) {
  clock += dt;
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      combo = 0;
      updateCombo();
    }
  }
  if (hold.on) {
    hold.t += dt;
    hold.acc += dt;
    const every = Math.max(0.07, 0.13 - hold.t * 0.03);
    if (hold.acc >= every) {
      hold.acc = 0;
      hitRandom();
    }
  }
  if (respawn > 0) {
    respawn -= dt;
    if (respawn <= 0) spawnBall(defOf('wax', save.selected.wax));
  }
  if (ball) {
    ball.grow = Math.min(1, ball.grow + dt / 0.26);
    ball.sqV += (-220 * ball.sq - 16 * ball.sqV) * dt;
    ball.sq += ball.sqV * dt;
    const decay = Math.exp(-14 * dt);
    ball.nx *= decay;
    ball.ny *= decay;
  }
  if (blob) updateBlob(blob, dt);

  const gravity = 1500 * (view.r / 150);
  const floor = view.h - 4;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.vy += gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.y > floor) {
      p.y = floor;
      p.vy *= -0.32;
      p.vx *= 0.7;
      p.vr *= 0.5;
    }
  }
  rings = rings.filter(ring => (ring.t += dt / 0.32) < 1);
  shake = calm ? 0 : shake * Math.exp(-13 * dt);
}

function drawParticle(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.globalAlpha = Math.min(1, p.life / 0.3);
  ctx.fillStyle = p.color;
  if (p.pts) {
    ctx.beginPath();
    p.pts.forEach((q, i) => i ? ctx.lineTo(q[0] * p.size, q[1] * p.size) : ctx.moveTo(q[0] * p.size, q[1] * p.size));
    ctx.closePath();
    ctx.fill();
    if (p.shape === 'shard') {
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  } else if (p.shape === 'drop') {
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size * 0.62, p.size, 0, 0, TAU);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, p.size * 0.6, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function popScale(g) {
  // 등장할 때 살짝 튀어 오르는 효과
  const pop = 1 + 1.7 * Math.pow(g - 1, 3) + 0.7 * Math.pow(g - 1, 2);
  return Math.max(0.01, calm ? g : pop);
}

function draw() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);
  if (shake > 0.05) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  if (ball) {
    const scale = popScale(ball.grow);
    const r = view.r;

    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath();
    ctx.ellipse(view.cx, view.cy + r * 1.06, r * 0.62 * scale, r * 0.09 * scale, 0, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(view.cx + ball.nx, view.cy + ball.ny);
    ctx.scale(scale * (1 + ball.sq), scale * (1 - ball.sq));
    drawBall(ctx, ball.def, r, ball.deco, ball, clock);
    ctx.restore();
  }

  if (blob) {
    const R = blobR();
    const scale = popScale(blob.grow);
    ctx.save();
    // 등장 효과는 바닥 가운데를 기준으로 커진다
    ctx.translate(view.cx, view.cy + R);
    ctx.scale(scale, scale);
    ctx.translate(-view.cx, -(view.cy + R));
    drawSoft(ctx, blob.def, blob, view.cx + blob.ox * R, view.cy + blob.oy * R, R, clock, view.cy + R * 1.04);
    ctx.restore();
  }

  rings.forEach(ring => {
    ctx.strokeStyle = `rgba(255,255,255,${0.55 * (1 - ring.t)})`;
    ctx.lineWidth = 8 * (1 - ring.t) + 1;
    ctx.beginPath();
    ctx.arc(ring.x, ring.y, ring.r * (1 + ring.t * 0.8), 0, TAU);
    ctx.stroke();
  });

  particles.forEach(drawParticle);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- 화면 UI ---------- */
const shelf = document.getElementById('shelf');
const cards = new Map();

function hideHint() {
  document.getElementById('hint').classList.add('off');
}

function showHint() {
  const el = document.getElementById('hint');
  el.textContent = TABS[save.tab].hint;
  el.classList.remove('off');
}

function updateStat() {
  document.getElementById('stat').textContent = TABS[save.tab].stat(save.counts[save.tab]);
}

function renderShelf() {
  shelf.textContent = '';
  cards.clear();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  TABS[save.tab].list.forEach((def, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.innerHTML = '<canvas></canvas><span class="name"></span>';
    btn.querySelector('.name').textContent = def.name;
    const thumb = btn.querySelector('canvas');
    thumb.width = thumb.height = Math.round(52 * dpr);
    const c = thumb.getContext('2d');
    if (save.tab === 'wax') {
      c.setTransform(dpr, 0, 0, dpr, 26 * dpr, 26 * dpr);
      drawBall(c, def, 24, makeDeco(i * 97 + 11), null, 0.5);
    } else {
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawSoft(c, def, null, 26, 26, 21, 0.5, 52);
    }
    btn.addEventListener('click', e => {
      selectItem(def);
      if (e.detail > 0) btn.blur(); // 마우스로 누른 뒤 스페이스가 카드 대신 놀이를 하도록
    });
    shelf.appendChild(btn);
    cards.set(def.id, btn);
  });
  refreshCards();
}

function refreshCards() {
  cards.forEach((btn, id) => {
    const on = save.selected[save.tab] === id;
    btn.classList.toggle('selected', on);
    btn.setAttribute('aria-pressed', String(on));
  });
}

function selectItem(def) {
  initAudio();
  save.selected[save.tab] = def.id;
  writeSave();
  particles = [];
  spawnCurrent();
  refreshCards();
  playPick();
}

function setTab(tab, first) {
  holdStop();
  softPtr = null;
  save.tab = tab;
  writeSave();
  app.dataset.tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
  combo = 0;
  updateCombo();
  particles = [];
  rings = [];
  updateStat();
  renderShelf();
  showHint();
  resize();
  spawnCurrent();
  const sel = cards.get(save.selected[tab]);
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest', inline: 'center' });
  if (!first) { initAudio(); playPick(); }
}

function applyMute() {
  const btn = document.getElementById('mute');
  btn.setAttribute('aria-pressed', String(save.muted));
  btn.setAttribute('aria-label', save.muted ? '소리 켜기' : '소리 끄기');
}

/* ---------- 입력 ---------- */
const localXY = e => {
  const rect = canvas.getBoundingClientRect();
  return [e.clientX - rect.left, e.clientY - rect.top];
};

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const [x, y] = localXY(e);
  if (save.tab === 'wax') {
    if (Math.hypot(x - view.cx, y - view.cy) <= view.r * 1.12) hitBall(x, y);
    return;
  }
  if (!blob || blob.grow < 0.5 || softPtr !== null) return;
  const c = blobCenter();
  const px = (x - c.x) / c.R, py = (y - c.y) / c.R;
  if (Math.hypot(px, py) > (blob.def.pull ? 1.35 : 1.15)) return;
  softPtr = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 캡처가 안 되어도 놀이는 가능 */ }
  pressStart(px, py, px);
});

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== softPtr || !blob) return;
  const [x, y] = localXY(e);
  const c = blobCenter();
  const px = (x - c.x) / c.R, py = (y - c.y) / c.R;
  const moved = Math.hypot(px - blob.px, py - blob.py) * c.R;
  blob.px = px;
  blob.py = py;
  // 슬라임을 끌면 끌어당기는 거리에 맞춰 질척질척 소리가 난다
  if (blob.def.pull && blob.stretch > 0.12) {
    blob.travel += moved;
    if (blob.travel > 26 && clock - blob.lastMove > 0.09) {
      blob.travel = 0;
      blob.lastMove = clock;
      playSoft('move', blob.def, clamp(blob.stretch / 1.2, 0, 1), clamp(px, -1, 1));
    }
  }
});

['pointerup', 'pointercancel'].forEach(type => {
  canvas.addEventListener(type, e => {
    if (e.pointerId !== softPtr) return;
    softPtr = null;
    pressRelease();
  });
});

const holdBtn = document.getElementById('hold');
holdBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { holdBtn.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  holdStart('btn');
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
  holdBtn.addEventListener(type, () => holdStop('btn'));
});

// 모바일 브라우저는 손을 뗄 때 소리 재생을 허용하므로 여기서도 깨운다
['pointerup', 'touchend', 'click', 'keydown'].forEach(type => {
  window.addEventListener(type, initAudio, { passive: true });
});

window.addEventListener('keydown', e => {
  if (e.repeat || (e.code !== 'Space' && e.code !== 'Enter')) return;
  if (e.target instanceof HTMLButtonElement && e.target !== holdBtn) return;
  e.preventDefault();
  if (save.tab === 'wax') {
    holdStart('key');
  } else if (blob && blob.grow > 0.5 && softPtr === null) {
    softPtr = 'key';
    pressStart(0, 0.2, 0);
  }
});
window.addEventListener('keyup', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  holdStop('key');
  if (softPtr === 'key') {
    softPtr = null;
    pressRelease();
  }
});

// 창이 가려지면 눌린 상태를 풀어서 계속 눌려 있는 일이 없게 한다
window.addEventListener('blur', () => {
  holdStop();
  if (softPtr !== null) {
    softPtr = null;
    pressRelease();
  }
});

document.getElementById('mute').addEventListener('click', e => {
  save.muted = !save.muted;
  writeSave();
  applyMute();
  if (e.detail > 0) e.currentTarget.blur();
});

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', e => {
    if (btn.dataset.tab !== save.tab) setTab(btn.dataset.tab, false);
    if (e.detail > 0) btn.blur();
  });
});

// iOS 사파리의 핀치 확대와 길게 누르기 메뉴 방지
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 시작 ---------- */
applyMute();
new ResizeObserver(resize).observe(stage);
compactQuery.addEventListener('change', resize);
setTab(save.tab, true);
requestAnimationFrame(frame);
</script>
</body>
</html>
